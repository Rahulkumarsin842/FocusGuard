
name: Build FocusGuard APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip FocusGuard_Phone_Build_Source.zip -d project

      - name: Build APK
        run: gradle -p project/FocusGuard assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: FocusGuard-APK
          path: project/FocusGuard/app/build/outputs/apk/debug/app-debug.apk
          
